<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - Tales & Books Shelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER with Theme Toggle -->
    <header class="story-header-bar">
        <button id="theme-toggle"> Dark/Light Mode</button>
    </header>

    <!-- MAIN STORY AREA -->
    <main class="story-container">

        <!-- Back Button -->
        <a href="index.html" class="back-btn">← Back to Books</a>

        <!-- Book Info -->
        <div class="story-info">
            <img id="story-cover" src="" alt="Book cover">
            <div>
                <h1 id="story-title"></h1>
                <p id="story-author"></p>
                <p id="story-genre"></p>
            </div>
        </div>

        <!-- Story Content -->
        <div class="story-box">
            <h2 id="chapter-title"></h2>
            <p id="story-text"></p>
        </div>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Storybook Reader App. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
