<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tales & Books Shelf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Tales & Books Shelf</h1>
        <p>Your favorite single-chapter stories all in one place</p>
        <button id="theme-toggle">Dark/Light Mode</button>
    </header>

    <!-- NAVIGATION -->
    <nav>
        <a href="#library">Book Library</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        <section id="library">
            <h2>Featured Books</h2>

            <!-- All 30 book cards will be added here by JavaScript -->
            <div class="book-grid" id="book-grid">
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Storybook For Kids . All rights reserved. Created by Christian Ray Tuanan. </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
